<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelly Delivery - Repartidores</title>
    <style>
        :root { --bg: #f4f7f6; --brand: #1877f2; --ok: #2ecc71; --ink: #1f2937; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); }
        .wrap { padding: 12px; max-width: 760px; margin: 0 auto; }
        .head { background: var(--brand); color: #fff; border-radius: 12px; padding: 12px; }
        .head h1 { margin: 0 0 8px 0; font-size: 1.3rem; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; }
        .input { flex: 1; min-width: 180px; border: none; border-radius: 8px; padding: 10px; }
        .btn { border: none; border-radius: 8px; padding: 10px 12px; font-weight: 700; cursor: pointer; }
        .btn-save { background: #e2e8f0; color: #0f172a; }
        .btn-back { background: #dbeafe; color: #1d4ed8; text-decoration: none; display: inline-flex; align-items: center; }
        .section { margin-top: 14px; background: #fff; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .section h2 { margin: 0; padding: 12px; font-size: 1rem; border-bottom: 1px solid #e5e7eb; }
        .list { padding: 8px; }
        .card { border: 1px solid #e5e7eb; border-left: 4px solid #3b82f6; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
        .card p { margin: 6px 0; }
        .card .money { font-weight: 700; }
        .btn-take { width: 100%; background: var(--ok); color: #fff; }
        .muted { color: #64748b; }
        .status { margin-top: 8px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="head">
            <h1>📱 Módulo Repartidores</h1>
            <div class="row">
                <input id="nombre-repartidor" class="input" placeholder="Tu UID de repartidor" />
                <button id="btn-guardar" class="btn btn-save">Guardar</button>
                <a href="./panel" class="btn btn-back">Volver a Cocina</a>
            </div>
            <div id="status" class="status">Conectando...</div>
        </div>

        <div class="section">
            <h2>Pedidos Disponibles</h2>
            <div id="lista-disponibles" class="list"></div>
        </div>

        <div class="section">
            <h2>Mis Pedidos</h2>
            <div id="lista-mios" class="list"></div>
        </div>
    </div>

    <script type="module">
        import { auth, rtdb } from './firebase.js';
        import { onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
        import { ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';

        const statusEl = document.getElementById('status');
        const nombreInput = document.getElementById('nombre-repartidor');
        const btnGuardar = document.getElementById('btn-guardar');
        const listaDisponibles = document.getElementById('lista-disponibles');
        const listaMios = document.getElementById('lista-mios');

        const DRIVER_TOKEN_ENDPOINTS = [
            'https://nelly-api-8lh1.onrender.com/api/auth/driver-token'
        ];

        const DELIVERY_ACCEPT_ENDPOINTS = [
            'https://nelly-api-8lh1.onrender.com/api/delivery/accept-order'
        ];

        let authRequestInFlight = false;
        let repartidorUid = localStorage.getItem('nelly_repartidor_uid') || '';
        nombreInput.value = repartidorUid;

        btnGuardar.onclick = () => {
            repartidorUid = String(nombreInput.value || '').trim();
            if (!repartidorUid) {
                statusEl.textContent = 'Escribe tu UID para tomar pedidos.';
                return;
            }
            localStorage.setItem('nelly_repartidor_uid', repartidorUid);
            statusEl.textContent = `UID guardado: ${repartidorUid}`;
            autenticar();
        };

        async function autenticar() {
            if (authRequestInFlight) return;

            if (!repartidorUid) {
                statusEl.textContent = 'Captura tu UID de repartidor para autenticar.';
                return;
            }

            authRequestInFlight = true;
            try {
                let response = null;
                for (const endpoint of DRIVER_TOKEN_ENDPOINTS) {
                    try {
                        const tokenUrl = `${endpoint}?uid=${encodeURIComponent(repartidorUid)}`;
                        const candidate = await fetch(tokenUrl, { method: 'GET' });
                        if (candidate.ok) {
                            response = candidate;
                            break;
                        }
                    } catch (_err) {}
                }
                if (!response) throw new Error('token_request_failed_all_endpoints');
                const data = await response.json();
                if (!data || !data.token) throw new Error('token_invalido');
                await signInWithCustomToken(auth, data.token);
            } catch (error) {
                statusEl.textContent = `Error de acceso: ${error.message}`;
            } finally {
                authRequestInFlight = false;
            }
        }

        function cardHTML(id, pedido, tomar = false) {
            const shortId = pedido.shortId || pedido.id_pedido || id;
            const monto = Number(pedido.monto || pedido.total || 0).toFixed(2);
            const cliente = pedido.cliente_nombre || pedido.cliente || 'Cliente';
            const descripcion = pedido.descripcion || 'Sin descripcion';
            const extra = tomar
                ? `<button class="btn btn-take" onclick="window.tomarPedido('${id}')">Tomar pedido</button>`
                : `<p class="muted">Asignado a ti</p>`;
            return `
                <div class="card">
                    <p><strong>#${shortId}</strong></p>
                    <p>${cliente}</p>
                    <p>${descripcion}</p>
                    <p class="money">$${monto}</p>
                    ${extra}
                </div>
            `;
        }

        function extraerMensajeError(errorBody, statusCode) {
            const raw = String(errorBody || '').trim();
            const lower = raw.toLowerCase();

            if (!raw && statusCode === 403) {
                return 'Perfil no autorizado como repartidor. Inicia sesion con cuenta de repartidor.';
            }
            if (lower.includes('limite de deuda')) {
                return 'Limite de deuda alcanzado. Favor de liquidar comisiones.';
            }
            if (lower.includes('ya fue tomado')) {
                return 'Este pedido ya fue tomado por otro repartidor.';
            }
            if (lower.includes('token') || statusCode === 401) {
                return 'Sesion invalida. Cierra sesion y vuelve a entrar.';
            }

            return raw || 'No se pudo tomar el pedido.';
        }

        window.tomarPedido = async (id) => {
            if (!repartidorUid) {
                statusEl.textContent = 'Primero guarda tu UID.';
                return;
            }

            try {
                const user = auth.currentUser;
                if (!user) {
                    statusEl.textContent = 'Sesion no activa. Reintenta autenticacion.';
                    return;
                }

                const idToken = await user.getIdToken();
                let success = false;
                let lastError = 'No se pudo contactar al servidor de reparto.';

                for (const endpoint of DELIVERY_ACCEPT_ENDPOINTS) {
                    try {
                        const response = await fetch(endpoint, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${idToken}`
                            },
                            body: JSON.stringify({ pedidoId: id })
                        });

                        if (response.ok) {
                            success = true;
                            break;
                        }

                        const body = await response.text();
                        lastError = extraerMensajeError(body, response.status);

                        if (response.status === 400 || response.status === 401 || response.status === 403 || response.status === 409) {
                            break;
                        }
                    } catch (_networkError) {
                        lastError = 'Servidor no disponible temporalmente. Intenta nuevamente.';
                    }
                }

                if (!success) {
                    statusEl.textContent = lastError;
                    return;
                }

                statusEl.textContent = `Pedido tomado: ${id}`;
            } catch (error) {
                statusEl.textContent = `Error al tomar pedido: ${error.message}`;
            }
        };

        function renderListas(raiz) {
            const data = raiz && typeof raiz === 'object' ? raiz : {};
            const disponibles = [];
            const mios = [];

            function normalizarEstado(valor) {
                const raw = String(valor || '').trim().toLowerCase();
                if (raw === 'listo' || raw === 'pendiente_aceptacion' || raw === 'listo_para_reparto' || raw === 'esperando_repartidor' || raw === 'despacho') return 'LISTO';
                if (raw === 'en_camino' || raw === 'en_curso' || raw === 'en_reparto' || raw === 'reparto' || raw === 'llegue_a_tienda' || raw === 'pedido_abordo' || raw === 'llegue_a_cliente') return 'EN_CURSO';
                if (raw === 'entregado' || raw === 'finalizado') return 'ENTREGADO';
                if (raw === 'cancelado' || raw === 'cancelada') return 'CANCELADO';
                return raw.toUpperCase();
            }

            Object.entries(data).forEach(([key, value]) => {
                if (!value || typeof value !== 'object') return;
                const logistica = value.logistica || {};
                const repartidorId = String(value.repartidor_id || value.conductorId || logistica.repartidor_id || '');
                const estado = normalizarEstado(value.estado_pedido || value.estado || logistica.estado);

                if (repartidorUid && repartidorId === repartidorUid && estado === 'EN_CURSO') {
                    mios.push({ key, pedido: value });
                    return;
                }

                if (!repartidorId && estado === 'LISTO') {
                    disponibles.push({ key, pedido: value });
                }
            });

            listaDisponibles.innerHTML = disponibles.length
                ? disponibles.map(({ key, pedido }) => cardHTML(key, pedido, true)).join('')
                : '<p class="muted">Sin pedidos disponibles</p>';

            listaMios.innerHTML = mios.length
                ? mios.map(({ key, pedido }) => cardHTML(key, pedido, false)).join('')
                : '<p class="muted">No tienes pedidos asignados</p>';
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                statusEl.textContent = repartidorUid ? `Activo como ${repartidorUid}` : 'Conectado. Guarda tu UID para tomar pedidos.';
                onValue(ref(rtdb, 'pedidos'), (snapshot) => {
                    renderListas(snapshot.val());
                }, (error) => {
                    statusEl.textContent = `Error de datos: ${error.message}`;
                });
            } else {
                autenticar();
            }
        });
    </script>
</body>
</html>
