<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Animate.css para animaciones de entrada elegantes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelly Delivery - Panel de Cocina Central</title>
    
    <style>
        :root { --primary: #1877f2; --success: #2ecc71; --dark: #1e293b; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .header { background: var(--primary); color: white; padding: 15px 25px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .status-badge { padding: 6px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; background: #e74c3c; }
        .online { background: #2ecc71 !important; }
        .stats { display: flex; gap: 20px; margin: 20px 0; }
        .stat-card { background: white; padding: 15px; border-radius: 10px; flex: 1; border-left: 5px solid var(--success); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .dashboard-container {
            display: flex;
            gap: 20px;
            min-height: calc(100vh - 220px);
            background-color: #f4f7f6;
        }
        .column {
            flex: 1;
            background: #ebedef;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .column-header {
            padding: 15px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pendientes { background-color: #e74c3c; }
        .reparto { background-color: #2ecc71; }
        .pedidos-grid {
            padding: 10px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .badge {
            background: rgba(255,255,255,0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
        .card-pedido {
            background: #ffffff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #3498db;
            transition: transform 0.2s ease;
        }
        .card-pedido:hover { transform: translateY(-3px); }
        .card-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .monto { font-weight: bold; color: #2c3e50; font-size: 1.1em; }
        .btn-action {
            width: 100%;
            border: none;
            padding: 10px;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Nelly Delivery - Cocina</h1>
        <div id="badge-estado" class="status-badge">CONECTANDO...</div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <small>GANANCIAS HOY</small>
            <div id="ganancias" style="font-size: 1.5rem; font-weight: bold;">$0.00</div>
        </div>
        <div class="stat-card" style="border-left-color: var(--primary);">
            <small>PEDIDOS EN COLA</small>
            <div id="contador" style="font-size: 1.5rem; font-weight: bold;">0</div>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="column">
            <div class="column-header pendientes">
                <h3>EN COCINA</h3>
                <span id="count-pendientes" class="badge">0</span>
            </div>
            <div id="contenedor-pendientes" class="pedidos-grid"></div>
        </div>
        <div class="column">
            <div class="column-header reparto">
                <h3>EN REPARTO</h3>
                <span id="count-reparto" class="badge">0</span>
            </div>
            <div id="contenedor-reparto" class="pedidos-grid"></div>
        </div>
    </div>

    <audio id="audio-notificacion" src="alerta.mp3" preload="auto"></audio>

    <script type="module">
        import { db, auth, rtdb } from "./firebase.js";
        import {
            doc,
            onSnapshot,
            serverTimestamp,
            setDoc,
            updateDoc,
            increment
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
        import {
            onAuthStateChanged,
            signInWithCustomToken
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import {
            onValue,
            ref,
            remove,
            set
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

        let sincronizacionIniciada = false;
        let authRequestInFlight = false;
        const pedidosPendientes = new Map();
        const pedidosReparto = new Map();
        const PANEL_TOKEN_ENDPOINTS = [
            "https://nelly-api-81h1.onrender.com/api/auth/panel-token",
            "https://nelly-api-8lh1.onrender.com/api/auth/panel-token"
        ];

        // Desbloqueo de audio tras la primera interacción del operador.
        document.addEventListener('click', () => {
            const audio = document.getElementById('audio-notificacion');
            if (audio) {
                audio.play().then(() => {
                    audio.pause();
                    audio.currentTime = 0;
                    console.log("Audio desbloqueado y listo para alertas.");
                }).catch(() => console.log("Esperando interacción..."));
            }
        }, { once: true });

        onAuthStateChanged(auth, (user) => {
            const badge = document.getElementById('badge-estado');
            if (user) {
                badge.textContent = "SISTEMA ONLINE";
                badge.classList.add('online');
                if (!sincronizacionIniciada) {
                    sincronizacionIniciada = true;
                    iniciarSincronizacion();
                }
            } else {
                autenticarPanelConBackend();
            }
        });

        async function autenticarPanelConBackend() {
            if (authRequestInFlight) {
                return;
            }

            authRequestInFlight = true;
            const badge = document.getElementById('badge-estado');

            try {
                let response = null;
                for (const endpoint of PANEL_TOKEN_ENDPOINTS) {
                    try {
                        const candidate = await fetch(endpoint, { method: "GET" });
                        if (candidate.ok) {
                            response = candidate;
                            break;
                        }
                    } catch (networkError) {
                        console.warn("Endpoint de token no disponible:", endpoint, networkError.message);
                    }
                }

                if (!response) {
                    throw new Error("token_request_failed_all_endpoints");
                }

                const data = await response.json();
                if (!data?.token) {
                    throw new Error("token_invalido");
                }

                await signInWithCustomToken(auth, data.token);
            } catch (error) {
                badge.textContent = "ERROR DE ACCESO";
                console.error("Error en validacion segura:", error.message);
                document.body.innerHTML = "<h1>ERROR DE ACCESO: Token invalido</h1>";
            } finally {
                authRequestInFlight = false;
            }
        }

        function iniciarSincronizacion() {
            const gananciasRef = doc(db, "metricas", "ganancias_hoy");

            onSnapshot(gananciasRef, (snap) => {
                const total = snap.exists() ? Number(snap.data().total || 0) : 0;
                document.getElementById('ganancias').innerText = `$${total.toFixed(2)}`;
            });

            onValue(ref(rtdb, "pedidos"), (snapshot) => {
                pedidosPendientes.clear();
                const raiz = snapshot.val();
                if (raiz && typeof raiz === "object") {
                    Object.entries(raiz).forEach(([key, value]) => {
                        if (!value || typeof value !== "object") {
                            return;
                        }
                        const pedidoId = value.id || key;
                        pedidosPendientes.set(pedidoId, {
                            id: pedidoId,
                            ...value,
                            __source: "rtdb"
                        });
                    });
                }
                actualizarPanel();
            }, (error) => {
                console.error("Error detectado en la sincronización RTDB:", error);
            });

            onValue(ref(rtdb, "pedidos_para_reparto"), (snapshot) => {
                pedidosReparto.clear();
                const raiz = snapshot.val();
                if (raiz && typeof raiz === "object") {
                    Object.entries(raiz).forEach(([key, value]) => {
                        if (!value || typeof value !== "object") {
                            return;
                        }
                        const pedidoId = value.id || key;
                        pedidosReparto.set(pedidoId, {
                            id: pedidoId,
                            ...value,
                            __source: "rtdb_reparto"
                        });
                    });
                }
                actualizarPanel();
            }, (error) => {
                console.error("Error detectado en pedidos_para_reparto:", error);
            });
        }

        /* === [BLOQUE NUEVO: MOTOR DE DESPACHO NELLY V3] === */
        function actualizarPanel() {
            const contenedorPendientes = document.getElementById('contenedor-pendientes');
            const contenedorReparto = document.getElementById('contenedor-reparto');
            contenedorPendientes.innerHTML = '';
            contenedorReparto.innerHTML = '';

            let cPendientes = 0;
            let cReparto = 0;

            pedidosPendientes.forEach((pedido, id) => {
                const estado = String(pedido.estado || 'pendiente');
                if (estado === 'pendiente') {
                    contenedorPendientes.insertAdjacentHTML('beforeend', generarHTMLTarjeta(pedido, id, true));
                    cPendientes++;
                } else if (estado === 'en_reparto' || estado === 'listo_para_reparto') {
                    contenedorReparto.insertAdjacentHTML('beforeend', generarHTMLTarjeta(pedido, id, false));
                    cReparto++;
                }
            });

            pedidosReparto.forEach((pedido, id) => {
                if (pedidosPendientes.has(id)) {
                    return;
                }
                contenedorReparto.insertAdjacentHTML('beforeend', generarHTMLTarjeta({ ...pedido, estado: 'en_reparto' }, id, false));
                cReparto++;
            });

            document.getElementById('count-pendientes').innerText = String(cPendientes);
            document.getElementById('count-reparto').innerText = String(cReparto);
            document.getElementById('contador').innerText = String(cPendientes + cReparto);
        }

        function generarHTMLTarjeta(pedido, id, esPendiente) {
            const monto = Number(pedido.monto || pedido.total || 0);
            const config = esPendiente
                ? { texto: 'LISTO PARA REPARTO', clase: 'btn-danger', funcion: `window.moverAReparto('${id}')` }
                : { texto: 'ENTREGA COMPLETADA', clase: 'btn-success', funcion: `window.finalizarPedido('${id}')` };

            return `
                <div class="card-pedido animate__animated animate__fadeIn">
                    <div class="card-header">
                        <strong>#${pedido.id_pedido || id.substring(0, 8)}</strong>
                        <span class="monto">$${monto.toFixed(2)}</span>
                    </div>
                    <div class="card-body">
                        <p class="cliente">${pedido.cliente_nombre || pedido.cliente || 'Cliente'}</p>
                        <p class="desc">${pedido.descripcion || 'Sin descripción'}</p>
                    </div>
                    <button onclick="${config.funcion}" class="btn-action ${config.clase}">
                        ${config.texto}
                    </button>
                </div>
            `;
        }

        window.moverAReparto = async function(id) {
            if (!confirm('¿Enviar pedido a la flota de reparto?')) {
                return;
            }

            const pedido = pedidosPendientes.get(id);
            if (!pedido) {
                alert('Pedido no encontrado en cocina.');
                return;
            }

            try {
                const datos = limpiarPedido(pedido);
                const payloadReparto = construirPayloadReparto({ ...pedido, id }, datos);
                await setDoc(doc(db, 'pedidos_para_reparto', id), {
                    ...payloadReparto,
                    actualizado_en: serverTimestamp(),
                }, { merge: true });
                await set(ref(rtdb, `pedidos_para_reparto/${id}`), payloadReparto);
                await set(ref(rtdb, `pedidos/${id}/estado`), 'en_reparto');
                await sumarGanancias(Number(pedido.monto || pedido.total || 0));
            } catch (error) {
                alert('Error en despacho: ' + error.message);
            }
        };

        window.finalizarPedido = async function(id) {
            if (!confirm('¿Confirmar entrega final al cliente?')) {
                return;
            }

            try {
                await set(ref(rtdb, `pedidos/${id}/estado`), 'entregado');
                await set(ref(rtdb, `pedidos/${id}/fecha_finalizado`), Date.now());
                await remove(ref(rtdb, `pedidos_para_reparto/${id}`));
            } catch (error) {
                alert('Error al finalizar: ' + error.message);
            }
        };
        /* === [FIN BLOQUE NUEVO] === */

        function limpiarPedido(pedido) {
            const limpio = { ...pedido };
            delete limpio.__source;
            delete limpio.__legacyPath;
            return limpio;
        }

        function numeroSeguro(valor) {
            const n = Number(valor);
            return Number.isFinite(n) ? n : null;
        }

        function construirPayloadReparto(pedido, datos) {
            const clienteNombre = pedido.cliente_nombre || pedido.cliente || "Usuario Nelly";
            const lat = numeroSeguro(pedido.cliente_lat ?? pedido.lat_cliente ?? pedido.lat ?? pedido.latitude);
            const lng = numeroSeguro(pedido.cliente_lng ?? pedido.lng_cliente ?? pedido.lng ?? pedido.longitude ?? pedido.lon);
            const tiempoEstimado = String(pedido.tiempo_estimado || "25 min");

            return {
                ...datos,
                id: pedido.id,
                id_pedido: pedido.id,
                pedido_id: pedido.id,
                estado: "esperando_repartidor",
                hora_cocina: new Date().toISOString(),
                fuente_origen: pedido.__source,
                cliente: {
                    nombre: clienteNombre,
                    coords: {
                        lat,
                        lng
                    }
                },
                logistica: {
                    estado: "disponible",
                    repartidor_id: null,
                    tiempo_estimado: tiempoEstimado
                }
            };
        }

        async function sumarGanancias(monto) {
            const gananciasRef = doc(db, "metricas", "ganancias_hoy");
            await updateDoc(gananciasRef, { total: increment(Number(monto || 0)) }).catch(async () => {
                await setDoc(gananciasRef, { total: Number(monto || 0) });
            });
        }


    </script>
</body>
</html>
