<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelly Delivery - Panel de Cocina Central</title>
    
    <style>
        :root { --primary: #1877f2; --success: #2ecc71; --dark: #1e293b; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .header { background: var(--primary); color: white; padding: 15px 25px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .status-badge { padding: 6px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; background: #e74c3c; }
        .online { background: #2ecc71 !important; }
        .stats { display: flex; gap: 20px; margin: 20px 0; }
        .stat-card { background: white; padding: 15px; border-radius: 10px; flex: 1; border-left: 5px solid var(--success); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .dashboard-container {
            display: flex;
            gap: 20px;
            min-height: calc(100vh - 220px);
            background-color: #f4f7f6;
        }
        .column {
            flex: 1;
            background: #ebedef;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .column-header {
            padding: 15px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pendientes { background-color: #e74c3c; }
        .reparto { background-color: #2ecc71; }
        .pedidos-grid {
            padding: 10px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .badge {
            background: rgba(255,255,255,0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
        .card-pedido {
            background: #ffffff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #3498db;
            transition: transform 0.2s ease;
        }
        .card-pedido:hover { transform: translateY(-3px); }
        .animate__animated { animation-duration: 450ms; animation-fill-mode: both; }
        .animate__fadeIn { animation-name: fadeInNelly; }
        @keyframes fadeInNelly {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .monto { font-weight: bold; color: #2c3e50; font-size: 1.1em; }
        .btn-action {
            width: 100%;
            border: none;
            padding: 10px;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
        .filtros { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-filtro, .btn-download {
            border: none;
            padding: 9px 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-filtro { background: #ecf0f1; color: #2c3e50; }
        .btn-download { background: #16a085; color: #fff; }
        #tabla-historial th, #tabla-historial td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.95rem;
        }
        #tabla-historial thead th {
            background: #f8fafc;
            color: #334155;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .badge-success {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 4px 10px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .debug-btn {
            position: fixed;
            right: 10px;
            top: 54px;
            z-index: 1001;
            border: none;
            border-radius: 8px;
            padding: 7px 10px;
            background: #111827;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        .debug-panel {
            position: fixed;
            right: 10px;
            bottom: 10px;
            width: 360px;
            max-height: 240px;
            overflow: auto;
            z-index: 1002;
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            font-size: 12px;
            display: none;
        }
        .debug-row { margin-bottom: 6px; line-height: 1.35; }
        .debug-row.ok { color: #86efac; }
        .debug-row.err { color: #fca5a5; }
        .toast-wrap {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }
        .toast {
            background: #1f2937;
            color: #fff;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        .toast.ok { background: #166534; }
        .toast.err { background: #991b1b; }
        @media (max-width: 900px) {
            .stats, .stats-grid, .dashboard-container { flex-direction: column; }
            .header { flex-direction: column; align-items: flex-start; gap: 12px; }
            #seccion-historial { top: 90px !important; }
            .debug-panel { width: calc(100% - 20px); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Nelly Delivery - Cocina</h1>
        <div id="badge-estado" class="status-badge">CONECTANDO...</div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <small>GANANCIAS HOY</small>
            <div id="ganancias" style="font-size: 1.5rem; font-weight: bold;">$0.00</div>
        </div>
        <div class="stat-card" style="border-left-color: var(--primary);">
            <small>PEDIDOS EN COLA</small>
            <div id="contador" style="font-size: 1.5rem; font-weight: bold;">0</div>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="column">
            <div class="column-header pendientes">
                <h3>EN COCINA</h3>
                <span id="count-pendientes" class="badge">0</span>
            </div>
            <div id="contenedor-pendientes" class="pedidos-grid"></div>
        </div>
        <div class="column">
            <div class="column-header reparto">
                <h3>EN REPARTO</h3>
                <span id="count-reparto" class="badge">0</span>
            </div>
            <div id="contenedor-reparto" class="pedidos-grid"></div>
        </div>
    </div>

        <!-- Botón para mostrar historial -->
        <button id="btn-historial" class="btn-filtro" style="position:fixed;top:10px;right:10px;z-index:1001;">📊 Corte de Caja</button>
        <button id="btn-debug" class="debug-btn">DEBUG</button>

        <!-- Sección oculta de historial de ventas/corte de caja -->
        <div id="seccion-historial" class="dashboard-container" style="display:none;flex-direction:column;gap:0;min-height:unset;background:#f4f7f6;position:fixed;top:60px;left:0;right:0;bottom:0;z-index:1000;box-shadow:0 8px 32px rgba(0,0,0,0.18);overflow:auto;">
            <div class="column-full" style="width:100%;">
                <div class="column-header" style="background-color: #34495e;">
                    <h3>📊 CORTE DE CAJA Y VENTAS</h3>
                    <div class="filtros">
                        <button onclick="filtrarVentas('hoy')" class="btn-filtro">Hoy</button>
                        <button onclick="filtrarVentas('semana')" class="btn-filtro">7 Días</button>
                        <button onclick="descargarCSV()" class="btn-download">📥 Exportar CSV</button>
                    </div>

                    <div id="toast-wrap" class="toast-wrap"></div>
                    <div id="debug-panel" class="debug-panel">
                        <strong>Debug RTDB</strong>
                        <div id="debug-log" style="margin-top:8px;"></div>
                    </div>
                </div>
                <div class="stats-grid" style="display:flex;gap:20px;margin:20px 0;">
                    <div class="stat-card">
                        <span class="label">Ventas Totales</span>
                        <span id="total-ventas" class="value">$0.00</span>
                    </div>
                    <div class="stat-card">
                        <span class="label">Comisiones (15%)</span>
                        <span id="total-comisiones" class="value">$0.00</span>
                    </div>
                    <div class="stat-card">
                        <span class="label">Pedidos Finalizados</span>
                        <span id="cantidad-pedidos" class="value">0</span>
                    </div>
                </div>
                <div class="tabla-container" style="overflow-x:auto;">
                    <table id="tabla-historial" style="width:100%;background:white;border-radius:8px;">
                        <thead>
                            <tr>
                                <th>Folio</th>
                                <th>Cliente</th>
                                <th>Monto</th>
                                <th>Fecha/Hora</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="body-historial">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    <audio id="audio-notificacion" src="alerta.mp3" preload="auto"></audio>

    <script type="module">
        import { db, auth, rtdb } from "./firebase.js";
        import {
            doc,
            onSnapshot,
            serverTimestamp,
            setDoc,
            updateDoc,
            increment
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
        import {
            onAuthStateChanged,
            signInWithCustomToken
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import {
            onValue,
            ref,
            remove,
            set
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

            // Mostrar/ocultar sección historial
            window.addEventListener('DOMContentLoaded', () => {
                const btn = document.getElementById('btn-historial');
                const seccion = document.getElementById('seccion-historial');
                const btnDebug = document.getElementById('btn-debug');
                const debugPanel = document.getElementById('debug-panel');
                btn.onclick = () => {
                    seccion.style.display = seccion.style.display === 'none' ? 'block' : 'none';
                };
                btnDebug.onclick = () => {
                    debugPanel.style.display = debugPanel.style.display === 'none' ? 'block' : 'none';
                };
            });

            function logDebug(mensaje, tipo = 'ok') {
                const debugLog = document.getElementById('debug-log');
                if (!debugLog) {
                    return;
                }
                const hora = new Date().toLocaleTimeString();
                const row = document.createElement('div');
                row.className = `debug-row ${tipo}`;
                row.textContent = `[${hora}] ${mensaje}`;
                debugLog.prepend(row);
            }

            function showToast(mensaje, tipo = 'ok') {
                const wrap = document.getElementById('toast-wrap');
                if (!wrap) {
                    return;
                }
                const toast = document.createElement('div');
                toast.className = `toast ${tipo}`;
                toast.textContent = mensaje;
                wrap.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 2200);
            }

            // Lógica para el Historial de Ventas
            window.filtrarVentas = (rango) => {
                const pedidosRef = ref(rtdb, 'pedidos');
                const hoy = new Date();
                hoy.setHours(0, 0, 0, 0);
                const inicioSemana = new Date();
                inicioSemana.setDate(hoy.getDate() - 6);
                inicioSemana.setHours(0, 0, 0, 0);

                onValue(pedidosRef, (snapshot) => {
                    let total = 0;
                    let count = 0;
                    let html = '';
                    snapshot.forEach((child) => {
                        const pedido = child.val();
                        const fechaPedido = new Date(pedido.fecha_finalizado || pedido.fecha_creacion).getTime();
                        let incluir = false;
                        if (pedido.estado === 'entregado') {
                            if (rango === 'hoy') {
                                incluir = fechaPedido >= hoy.getTime();
                            } else if (rango === 'semana') {
                                incluir = fechaPedido >= inicioSemana.getTime();
                            } else {
                                incluir = true;
                            }
                        }
                        if (incluir) {
                            total += parseFloat(pedido.monto || 0);
                            count++;
                            html += `
                                <tr>
                                    <td>${pedido.id_pedido || ''}</td>
                                    <td>${pedido.cliente_nombre || ''}</td>
                                    <td>$${pedido.monto || '0.00'}</td>
                                    <td>${new Date(fechaPedido).toLocaleString()}</td>
                                    <td><span class="badge-success">Entregado</span></td>
                                </tr>
                            `;
                        }
                    });
                    document.getElementById('body-historial').innerHTML = html;
                    document.getElementById('total-ventas').innerText = `$${total.toFixed(2)}`;
                    document.getElementById('total-comisiones').innerText = `$${(total * 0.15).toFixed(2)}`;
                    document.getElementById('cantidad-pedidos').innerText = count;
                }, { onlyOnce: true });
            };

            // Exportar tabla a CSV
            window.descargarCSV = () => {
                let csvContent = "data:text/csv;charset=utf-8,Folio,Cliente,Monto,Fecha\n";
                const filas = document.querySelectorAll("#body-historial tr");
                filas.forEach(fila => {
                    const cols = fila.querySelectorAll("td");
                    const row = Array.from(cols).map(c => c.innerText).join(",");
                    csvContent += row + "\n";
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Corte_Nelly_${new Date().toLocaleDateString()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

        let sincronizacionIniciada = false;
        let authRequestInFlight = false;
        const pedidosPendientes = new Map();
        const pedidosReparto = new Map();
        const PANEL_TOKEN_ENDPOINTS = [
            "https://nelly-api-81h1.onrender.com/api/auth/panel-token",
            "https://nelly-api-8lh1.onrender.com/api/auth/panel-token"
        ];

        // Desbloqueo de audio tras la primera interacción del operador.
        document.addEventListener('click', () => {
            const audio = document.getElementById('audio-notificacion');
            if (audio) {
                audio.play().then(() => {
                    audio.pause();
                    audio.currentTime = 0;
                    console.log("Audio desbloqueado y listo para alertas.");
                }).catch(() => {});
            }
        }, { once: true });

        onAuthStateChanged(auth, (user) => {
            const badge = document.getElementById('badge-estado');
            if (user) {
                badge.textContent = "SISTEMA ONLINE";
                badge.classList.add('online');
                if (!sincronizacionIniciada) {
                    sincronizacionIniciada = true;
                    iniciarSincronizacion();
                }
            } else {
                autenticarPanelConBackend();
            }
        });

        async function autenticarPanelConBackend() {
            if (authRequestInFlight) {
                return;
            }

            authRequestInFlight = true;
            const badge = document.getElementById('badge-estado');

            try {
                let response = null;
                for (const endpoint of PANEL_TOKEN_ENDPOINTS) {
                    try {
                        const candidate = await fetch(endpoint, { method: "GET" });
                        if (candidate.ok) {
                            response = candidate;
                            break;
                        }
                    } catch (networkError) {
                        console.warn("Endpoint de token no disponible:", endpoint, networkError.message);
                    }
                }

                if (!response) {
                    throw new Error("token_request_failed_all_endpoints");
                }

                const data = await response.json();
                if (!data?.token) {
                    throw new Error("token_invalido");
                }

                await signInWithCustomToken(auth, data.token);
            } catch (error) {
                badge.textContent = "ERROR DE ACCESO";
                console.error("Error en validacion segura:", error.message);
                document.body.innerHTML = "<h1>ERROR DE ACCESO: Token invalido</h1>";
            } finally {
                authRequestInFlight = false;
            }
        }

        function iniciarSincronizacion() {
            const gananciasRef = doc(db, "metricas", "ganancias_hoy");

            onSnapshot(gananciasRef, (snap) => {
                const total = snap.exists() ? Number(snap.data().total || 0) : 0;
                document.getElementById('ganancias').innerText = `$${total.toFixed(2)}`;
            });

            onValue(ref(rtdb, "pedidos"), (snapshot) => {
                pedidosPendientes.clear();
                const raiz = snapshot.val();
                if (raiz && typeof raiz === "object") {
                    Object.entries(raiz).forEach(([key, value]) => {
                        if (!value || typeof value !== "object") {
                            return;
                        }
                        const pedidoId = value.id || value.id_pedido || key;
                        pedidosPendientes.set(key, {
                            ...value,
                            id: pedidoId,
                            _rtdbKey: key,
                            __source: "rtdb"
                        });
                    });
                }
                actualizarPanel();
            }, (error) => {
                console.error("Error detectado en la sincronización RTDB:", error);
            });

            onValue(ref(rtdb, "pedidos_para_reparto"), (snapshot) => {
                pedidosReparto.clear();
                const raiz = snapshot.val();
                if (raiz && typeof raiz === "object") {
                    Object.entries(raiz).forEach(([key, value]) => {
                        if (!value || typeof value !== "object") {
                            return;
                        }
                        const pedidoId = value.id || value.id_pedido || key;
                        pedidosReparto.set(key, {
                            ...value,
                            id: pedidoId,
                            _rtdbKey: key,
                            __source: "rtdb_reparto"
                        });
                    });
                }
                actualizarPanel();
            }, (error) => {
                console.error("Error detectado en pedidos_para_reparto:", error);
            });
        }

        /* === [BLOQUE NUEVO: MOTOR DE DESPACHO NELLY V3] === */
        function actualizarPanel() {
            const contenedorPendientes = document.getElementById('contenedor-pendientes');
            const contenedorReparto = document.getElementById('contenedor-reparto');
            contenedorPendientes.innerHTML = '';
            contenedorReparto.innerHTML = '';

            let cPendientes = 0;
            let cReparto = 0;

            pedidosPendientes.forEach((pedido, id) => {
                const estado = String(pedido.estado || 'pendiente');
                if (estado === 'pendiente') {
                    contenedorPendientes.insertAdjacentHTML('beforeend', generarHTMLTarjeta(pedido, id, true));
                    cPendientes++;
                } else if (estado === 'en_reparto' || estado === 'listo_para_reparto') {
                    contenedorReparto.insertAdjacentHTML('beforeend', generarHTMLTarjeta(pedido, id, false));
                    cReparto++;
                }
            });

            pedidosReparto.forEach((pedido, id) => {
                if (pedidosPendientes.has(id)) {
                    return;
                }
                contenedorReparto.insertAdjacentHTML('beforeend', generarHTMLTarjeta({ ...pedido, estado: 'en_reparto' }, id, false));
                cReparto++;
            });

            document.getElementById('count-pendientes').innerText = String(cPendientes);
            document.getElementById('count-reparto').innerText = String(cReparto);
            document.getElementById('contador').innerText = String(cPendientes + cReparto);
        }

        function generarHTMLTarjeta(pedido, id, esPendiente) {
            const monto = Number(pedido.monto || pedido.total || 0);
            const config = esPendiente
                ? { texto: 'LISTO PARA REPARTO', clase: 'btn-danger', funcion: `window.moverAReparto('${id}')` }
                : { texto: 'ENTREGA COMPLETADA', clase: 'btn-success', funcion: `window.finalizarPedido('${id}')` };

            return `
                <div class="card-pedido animate__animated animate__fadeIn">
                    <div class="card-header">
                        <strong>#${pedido.id_pedido || id.substring(0, 8)}</strong>
                        <span class="monto">$${monto.toFixed(2)}</span>
                    </div>
                    <div class="card-body">
                        <p class="cliente">${pedido.cliente_nombre || pedido.cliente || 'Cliente'}</p>
                        <p class="desc">${pedido.descripcion || 'Sin descripción'}</p>
                    </div>
                    <button onclick="${config.funcion}" class="btn-action ${config.clase}">
                        ${config.texto}
                    </button>
                </div>
            `;
        }

        window.moverAReparto = async function(id) {
            if (!confirm('¿Enviar pedido a la flota de reparto?')) {
                return;
            }

            const pedido = pedidosPendientes.get(id);
            if (!pedido) {
                alert('Pedido no encontrado en cocina.');
                return;
            }

            try {
                const rtdbKey = pedido._rtdbKey || id;
                const datos = limpiarPedido(pedido);
                const payloadReparto = construirPayloadReparto({ ...pedido, id: rtdbKey }, datos);
                logDebug(`MOVE start key=${rtdbKey}`);
                await setDoc(doc(db, 'pedidos_para_reparto', rtdbKey), {
                    ...payloadReparto,
                    actualizado_en: serverTimestamp(),
                }, { merge: true });
                logDebug(`setDoc pedidos_para_reparto/${rtdbKey}`);
                await set(ref(rtdb, `pedidos_para_reparto/${rtdbKey}`), payloadReparto);
                logDebug(`set RTDB pedidos_para_reparto/${rtdbKey}`);
                await set(ref(rtdb, `pedidos/${rtdbKey}/estado`), 'en_reparto');
                logDebug(`set RTDB pedidos/${rtdbKey}/estado=en_reparto`);
                await sumarGanancias(Number(pedido.monto || pedido.total || 0));
                showToast('Pedido movido a reparto', 'ok');
            } catch (error) {
                logDebug(`MOVE error: ${error.message}`, 'err');
                showToast(`Error mover a reparto: ${error.message}`, 'err');
                alert('Error en despacho: ' + error.message);
            }
        };

        window.finalizarPedido = async function(id) {
            if (!confirm('¿Confirmar entrega final al cliente?')) {
                return;
            }

            try {
                const pedido = pedidosReparto.get(id) || pedidosPendientes.get(id);
                const rtdbKey = (pedido && pedido._rtdbKey) ? pedido._rtdbKey : id;
                logDebug(`FINISH start key=${rtdbKey}`);
                await set(ref(rtdb, `pedidos/${rtdbKey}/estado`), 'entregado');
                logDebug(`set RTDB pedidos/${rtdbKey}/estado=entregado`);
                await set(ref(rtdb, `pedidos/${rtdbKey}/fecha_finalizado`), Date.now());
                logDebug(`set RTDB pedidos/${rtdbKey}/fecha_finalizado`);
                await remove(ref(rtdb, `pedidos_para_reparto/${rtdbKey}`));
                logDebug(`remove RTDB pedidos_para_reparto/${rtdbKey}`);
                showToast('Pedido completado', 'ok');
            } catch (error) {
                logDebug(`FINISH error: ${error.message}`, 'err');
                showToast(`Error completar pedido: ${error.message}`, 'err');
                alert('Error al finalizar: ' + error.message);
            }
        };
        /* === [FIN BLOQUE NUEVO] === */

        function limpiarPedido(pedido) {
            const limpio = { ...pedido };
            delete limpio.__source;
            delete limpio.__legacyPath;
            delete limpio._rtdbKey;
            return limpio;
        }

        function numeroSeguro(valor) {
            const n = Number(valor);
            return Number.isFinite(n) ? n : null;
        }

        function construirPayloadReparto(pedido, datos) {
            const clienteNombre = pedido.cliente_nombre || pedido.cliente || "Usuario Nelly";
            const lat = numeroSeguro(pedido.cliente_lat ?? pedido.lat_cliente ?? pedido.lat ?? pedido.latitude);
            const lng = numeroSeguro(pedido.cliente_lng ?? pedido.lng_cliente ?? pedido.lng ?? pedido.longitude ?? pedido.lon);
            const tiempoEstimado = String(pedido.tiempo_estimado || "25 min");

            return {
                ...datos,
                id: pedido.id,
                id_pedido: pedido.id,
                pedido_id: pedido.id,
                estado: "esperando_repartidor",
                hora_cocina: new Date().toISOString(),
                fuente_origen: pedido.__source,
                cliente: {
                    nombre: clienteNombre,
                    coords: {
                        lat,
                        lng
                    }
                },
                logistica: {
                    estado: "disponible",
                    repartidor_id: null,
                    tiempo_estimado: tiempoEstimado
                }
            };
        }

        async function sumarGanancias(monto) {
            const gananciasRef = doc(db, "metricas", "ganancias_hoy");
            await updateDoc(gananciasRef, { total: increment(Number(monto || 0)) }).catch(async () => {
                await setDoc(gananciasRef, { total: Number(monto || 0) });
            });
        }


    </script>
