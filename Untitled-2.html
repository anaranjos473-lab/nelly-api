<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelly Delivery - Panel Realtime</title>
        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
            import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
            const firebaseConfig = {
                apiKey: "AIzaSyAhHZvA2T-1xkIrCBpljgWPzDmynucT9_E",
                authDomain: "nelly-delivery.firebaseapp.com",
                databaseURL: "https://nelly-delivery-default-rtdb.firebaseio.com",
                projectId: "nelly-delivery",
                storageBucket: "nelly-delivery.firebasestorage.app",
                messagingSenderId: "5451083162",
                appId: "1:5451083162:web:06b03a76f50b74b60bde23"
            };
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);
            window.nellyDb = db;
        </script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .header { background: #1877f2; color: white; padding: 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 5px solid #2ecc71; }
        .btn { background: #2ecc71; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #27ae60; }
        .status-on { background: #2ecc71; padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Nelly Delivery - Cocina</h1>
        <span id="conexion" class="status-on">Conectando...</span>
    </div>

    <div id="lista-pedidos" class="grid">
        <p style="text-align: center; grid-column: 1/-1;">Esperando pedidos de la base de datos...</p>
    </div>

    <script>
                import { ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
                const db = window.nellyDb;
                // Monitor de conexión
                onValue(ref(db, '.info/connected'), (snap) => {
                    const label = document.getElementById('conexion');
                    if (snap.val() === true) {
                        label.innerText = "SISTEMA ONLINE";
                        label.style.background = "#2ecc71";
                    } else {
                        label.innerText = "SIN CONEXIÓN";
                        label.style.background = "#e74c3c";
                    }
                });
                // ESCUCHAR PEDIDOS EN TIEMPO REAL
                onValue(ref(db, 'pedidos'), (snapshot) => {
                    const div = document.getElementById('lista-pedidos');
                    div.innerHTML = "";
                    if (!snapshot.exists()) {
                        div.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>No hay pedidos pendientes en Firebase.</p>";
                        return;
                    }
                    snapshot.forEach((child) => {
                        const p = child.val();
                        div.innerHTML += `
                            <div class="card">
                                    <h3>Folio: #${child.key}</h3>
                                    <p><strong>Cliente:</strong> ${p.cliente || 'No especificado'}</p>
                                    <p><strong>Total:</strong> $${p.total || p.monto || 0}</p>
                                    <button class="btn" onclick="window.entregarPedido('${child.key}')">Marcar como Entregado</button>
                            </div>
                        `;
                    });
                });
                // Función para limpiar pedido al terminar
                window.entregarPedido = function(id) {
                    if(confirm("¿Confirmas que el pedido está listo?")) {
                        remove(ref(db, 'pedidos/' + id));
                    }
                }
    </script>
</body>
</html>
