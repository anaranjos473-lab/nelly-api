name: Android Signed APK

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Variant to build"
        required: false
        default: "Release"

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Android project files
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "No se encontro ./gradlew en la raiz del repo."
            echo "Sube el proyecto Android completo con Gradle Wrapper para habilitar Signed APK."
            exit 1
          fi
          if [ ! -f "./app/build.gradle" ] && [ ! -f "./app/build.gradle.kts" ]; then
            echo "No se encontro archivo de build del modulo app."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Falta secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android-keystore.jks

      - name: Build signed APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_VARIANT: ${{ github.event.inputs.build_variant }}
        run: |
          if [ -z "${KEYSTORE_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "Faltan secrets de firma Android (password/alias)."
            exit 1
          fi

          chmod +x ./gradlew

          VARIANT="${BUILD_VARIANT:-Release}"
          TASK="assemble${VARIANT}"

          ./gradlew \
            "${TASK}" \
            -Pandroid.injected.signing.store.file="${KEYSTORE_PATH}" \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"

      - name: Locate signed APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | sort | tail -n 1)
          if [ -z "${APK_PATH}" ]; then
            echo "No se encontro APK en app/build/outputs/apk"
            exit 1
          fi
          echo "apk_path=${APK_PATH}" >> "$GITHUB_OUTPUT"
          echo "APK detectado: ${APK_PATH}"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
