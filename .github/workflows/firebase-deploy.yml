name: Firebase Deploy

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "firestore.rules"
      - "database.rules.json"
      - "firebase.json"

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run agent validation suite
        run: npm run test:agents

      - name: Deploy to Firebase (rules + hosting)
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules,database:rules,hosting --project nelly-delivery --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
