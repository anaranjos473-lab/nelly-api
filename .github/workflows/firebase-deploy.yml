name: Firebase Deploy

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "firestore.rules"
      - "database.rules.json"
      - "firebase.json"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Razón del deploy manual"
        required: false
        default: "Deploy manual"

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run agent validation suite
        run: npm run test:agents

      - name: Deploy to Firebase (rules + hosting)
        run: |
          # Limpiar token de espacios/saltos de línea
          CLEAN_TOKEN=$(echo "$FIREBASE_TOKEN" | tr -d '[:space:]')
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "ERROR: FIREBASE_TOKEN está vacío. Ve a Settings > Secrets y verifica."
            exit 1
          fi
          echo "Token recibido: ${#CLEAN_TOKEN} caracteres ✓"
          npm install -g firebase-tools
          firebase deploy --only firestore:rules,database:rules,hosting --project nelly-delivery --non-interactive --token "$CLEAN_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
