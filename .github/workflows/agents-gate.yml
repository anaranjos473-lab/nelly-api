name: Validate Agent Protocol

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security check (branch-aware)
        run: |
          TARGET_BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          echo "Audit target branch: ${TARGET_BRANCH}"

          if [[ "${TARGET_BRANCH}" == "main" || "${TARGET_BRANCH}" == release/* ]]; then
            npm audit --audit-level=high
          else
            npm audit --audit-level=critical
          fi

      - name: Run agent validation suite
        run: npm run test:agents

      - name: Integration check (diagnostic)
        continue-on-error: true
        env:
          NELLY_STRICT: "false"
          NELLY_RETRIES: "5"
          NELLY_INTERVAL_MS: "1500"
          ORDER_INGEST_API_KEY: ${{ secrets.ORDER_INGEST_API_KEY }}
          RENDER_URL: ${{ secrets.RENDER_URL }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_ADMIN_JSON: ${{ secrets.FIREBASE_ADMIN_JSON }}
        run: |
          node final_test.js

      - name: Integration check (strict)
        env:
          NELLY_STRICT: "true"
          NELLY_RETRIES: "5"
          NELLY_INTERVAL_MS: "1500"
          ORDER_INGEST_API_KEY: ${{ secrets.ORDER_INGEST_API_KEY }}
          RENDER_URL: ${{ secrets.RENDER_URL }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_ADMIN_JSON: ${{ secrets.FIREBASE_ADMIN_JSON }}
        run: |
          node final_test.js

      - name: Notify on Failure (enriched)
        if: ${{ failure() }}
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_ACTOR: ${{ github.actor }}
          GH_COMMIT_MSG: ${{ github.event.head_commit.message }}
          GH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "WEBHOOK_URL no configurado. Saltando notificación."
            exit 0
          fi

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [
              {
                "title": "FALLO DE INTEGRACION - NELLY 4.0.0-PRO",
                "description": "El pipeline de integracion estricta ha fallado. El avance fue bloqueado para proteger el sistema.",
                "color": 15158332,
                "fields": [
                  {
                    "name": "Entorno",
                    "value": "CI / Validate Agent Protocol",
                    "inline": true
                  },
                  {
                    "name": "Severidad",
                    "value": "ALTA",
                    "inline": true
                  },
                  {
                    "name": "Rama",
                    "value": "${GH_REF_NAME}",
                    "inline": true
                  },
                  {
                    "name": "Autor",
                    "value": "${GH_ACTOR}",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "${GH_COMMIT_MSG:-N/A}",
                    "inline": false
                  },
                  {
                    "name": "Run",
                    "value": "${GH_RUN_URL}",
                    "inline": false
                  }
                ],
                "footer": {
                  "text": "Nelly Logistics Sentinel v4.0"
                }
              }
            ]
          }
          EOF
          )

          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL" || true