name: Validate Agent Protocol

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run agent validation suite
        run: npm run test:agents
name: Agent Validation Gate

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-agents:
    name: Validate Agent Protocol
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pre-commit was not bypassed
        shell: bash
        run: |
          set -euo pipefail
          RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          if git log --format=%B "$RANGE" | grep -q "Agent-Gate: bypass-or-missing"; then
            echo "NO PASA: Se detecto commit con bypass de hook (--no-verify o gate omitido)."
            echo "Accion: revisar AGENTS.md y skills aplicables antes de volver a abrir PR."
            exit 1
          fi

      - name: Run mandatory agent suite
        run: npm run test:agents
