<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Nelly Delivery 🛵</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card-header { background-color: #00ACC1; color: white; font-weight: bold; }
        .btn-dispatch { background-color: #26C6DA; color: white; border: none; }
        .btn-dispatch:hover { background-color: #00838F; color: white; }
        .status-badge { padding: 5px 10px; border-radius: 12px; font-size: 0.9em; }
        .status-new { background-color: #ffecb3; color: #ff6f00; }
        .status-cooking { background-color: #fff9c4; color: #fbc02d; }
        .status-way { background-color: #e0f7fa; color: #006064; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h3>🤖 Nelly Delivery - Cocina</h3>
            <span id="connection-status" class="badge bg-danger">Desconectado</span>
        </div>
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Folio</th>
                        <th>Cliente</th>
                        <th>Hora</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-pedidos">
                    </tbody>
            </table>
            <div id="sin-pedidos" class="text-center text-muted py-4">
                Esperando pedidos... 🕒
            </div>
        </div>
    </div>
</div>

<audio id="notificacion" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script type="module">
  // Importamos desde URL para que funcione en el navegador sin instalar nada extra
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  // --- TUS CREDENCIALES REALES (Ya configuradas) ---
  const firebaseConfig = {
    apiKey: "AIzaSyAhHZvA2T-1xkIrCBpljgWPzDmynucT9_E",
    authDomain: "nelly-delivery.firebaseapp.com",
    databaseURL: "https://nelly-delivery-default-rtdb.firebaseio.com",
    projectId: "nelly-delivery",
    storageBucket: "nelly-delivery.firebasestorage.app",
    messagingSenderId: "5451083162",
    appId: "1:5451083162:web:06b03a76f50b74b60bde23",
    measurementId: "G-0H2BKP1G8L"
  };

  // Iniciar Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const statusBadge = document.getElementById("connection-status");

  // Escuchar pedidos en tiempo real
  const pedidosRef = ref(db, 'pedidos');
  
  onValue(pedidosRef, (snapshot) => {
    // Confirmar conexión visualmente
    statusBadge.className = "badge bg-success";
    statusBadge.innerText = "En Línea 🟢";

    const data = snapshot.val();
    const tbody = document.getElementById("tabla-pedidos");
    const sinPedidos = document.getElementById("sin-pedidos");
    
    tbody.innerHTML = ""; // Limpiar tabla antes de llenarla
    
    if (data) {
        sinPedidos.style.display = "none";
        
        Object.keys(data).forEach((key) => {
            const pedido = data[key];
            // Formatear hora si existe, si no, poner hora actual
            const fecha = pedido.timestamp ? new Date(pedido.timestamp).toLocaleTimeString() : "Ahora";
            
            let badgeClass = "bg-secondary";
            if(pedido.estado === "Confirmado") badgeClass = "status-new";
            if(pedido.estado === "Cocinando") badgeClass = "status-cooking";
            if(pedido.estado === "En Camino") badgeClass = "status-way";

            const row = `
                <tr>
                    <td class="fw-bold">#${pedido.folio}</td>
                    <td>${pedido.cliente || "Cliente"}</td>
                    <td>${fecha}</td>
                    <td><span class="status-badge ${badgeClass}">${pedido.estado}</span></td>
                    <td>
                        ${pedido.estado === 'Confirmado' ? 
                          `<button class="btn btn-warning btn-sm" onclick="window.cambiarEstado('${key}', 'Cocinando')">🔥 Cocinar</button>` : 
                          pedido.estado === 'Cocinando' ?
                          `<button class="btn btn-dispatch btn-sm" onclick="window.cambiarEstado('${key}', 'En Camino')">🛵 Despachar</button>` :
                          `<span class="text-success">✅ Completado</span>`
                        }
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    } else {
        sinPedidos.style.display = "block";
    }
  });

  // Función global para los botones de acción
  window.cambiarEstado = (folio, nuevoEstado) => {
      update(ref(db, 'pedidos/' + folio), {
          estado: nuevoEstado
      });
  };
</script>

</body>
</html>
