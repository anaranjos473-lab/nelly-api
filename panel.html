<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelly Delivery - Panel de Cocina Central</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        :root { --primary: #1877f2; --success: #2ecc71; --dark: #1e293b; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .header { background: var(--primary); color: white; padding: 15px 25px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .status-badge { padding: 6px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; background: #e74c3c; }
        .online { background: #2ecc71 !important; }
        
        .stats { display: flex; gap: 20px; margin: 20px 0; }
        .stat-card { background: white; padding: 15px; border-radius: 10px; flex: 1; border-left: 5px solid var(--success); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 8px solid #fb7185; }
        .btn-ready { background: var(--success); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Nelly Delivery - Cocina</h1>
        <div id="badge-estado" class="status-badge">CONECTANDO...</div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <small>GANANCIAS HOY</small>
            <div id="ganancias" style="font-size: 1.5rem; font-weight: bold;">$0.00</div>
        </div>
        <div class="stat-card" style="border-left-color: var(--primary);">
            <small>PEDIDOS EN COLA</small>
            <div id="contador" style="font-size: 1.5rem; font-weight: bold;">0</div>
        </div>
    </div>

    <div id="contenedor-pedidos" class="grid"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAhHZvA2T-1xkIrCBpljgWPzDmynucT9_E",
            authDomain: "nelly-delivery.firebaseapp.com",
            databaseURL: "https://nelly-delivery-default-rtdb.firebaseio.com",
            projectId: "nelly-delivery",
            storageBucket: "nelly-delivery.firebasestorage.app",
            messagingSenderId: "5451083162",
            appId: "1:5451083162:web:06b03a76f50b74b60bde23"
        };
        firebase.initializeApp(firebaseConfig);

        const db = firebase.database();
        const audio = new Audio('alerta.mp3');
        let contadorPrevio = 0;

        // 1. AUTENTICACIÓN AUTOMÁTICA
        firebase.auth().onAuthStateChanged((user) => {
            const badge = document.getElementById('badge-estado');
            if (user) {
                badge.textContent = "SISTEMA ONLINE";
                badge.classList.add('online');
                iniciarSincronizacion();
            } else {
                firebase.auth().signInWithEmailAndPassword("admin@nelly.com", "Nelly2026!*")
                    .catch(err => console.error("Error de acceso:", err));
            }
        });

        function iniciarSincronizacion() {
            // Escuchar Ganancias
            db.ref('ganancias_hoy').on('value', snap => {
                document.getElementById('ganancias').innerText = `$${parseFloat(snap.val() || 0).toFixed(2)}`;
            });

            // Escuchar Pedidos (Nodo "Pedidos" con Mayúscula)
            db.ref('Pedidos').on('value', (snapshot) => {
                const container = document.getElementById('contenedor-pedidos');
                const total = snapshot.numChildren();
                
                // Sonido de alerta si hay nuevos pedidos
                if (total > contadorPrevio && contadorPrevio !== 0) {
                    audio.play().catch(e => console.log("Se requiere interacción para sonar"));
                }
                contadorPrevio = total;
                document.getElementById('contador').innerText = total;

                container.innerHTML = "";
                if (!snapshot.exists()) {
                    container.innerHTML = "<p style='grid-column:1/-1; text-align:center;'>No hay pedidos pendientes hoy. 🍳</p>";
                    return;
                }

                snapshot.forEach((child) => {
                    const p = child.val();
                    const monto = p.monto || p.total || 0;
                    container.innerHTML += `
                        <div class="card">
                            <b>Folio: #${child.key.substring(0,6)}</b><br>
                            <p>👤 ${p.cliente_nombre || p.cliente || 'Usuario'}</p>
                            <p>📝 ${p.descripcion || 'Sin nota'}</p>
                            <div style="color:var(--primary); font-weight:bold; font-size:1.2rem;">$${parseFloat(monto).toFixed(2)}</div>
                            <button class="btn-ready" onclick="despachar('${child.key}', ${monto})">LISTO PARA REPARTO</button>
                        </div>`;
                });
            });
        }

        async function despachar(id, monto) {
            if (!confirm("¿Mover pedido a la flota de repartidores?")) return;
            try {
                const snap = await db.ref('Pedidos/' + id).once('value');
                const datos = snap.val();

                // 1. Mover a pedidos_para_reparto
                await db.ref('pedidos_para_reparto/' + id).set({
                    ...datos,
                    estado: 'esperando_repartidor',
                    hora_cocina: new Date().toLocaleTimeString()
                });

                // 2. Sumar ganancia y borrar de cocina
                await db.ref('ganancias_hoy').transaction(c => (c || 0) + parseFloat(monto));
                await db.ref('Pedidos/' + id).remove();
                
            } catch (e) { alert("Error: " + e.message); }
        }
    </script>
</body>
</html>
