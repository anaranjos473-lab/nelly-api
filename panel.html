<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nelly Delivery - Panel de Cocina</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; }
        .header { background: #34495e; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .status-badge { padding: 5px 15px; border-radius: 20px; font-weight: bold; background: #e74c3c; } /* Rojo por defecto */
        .conectado { background: #2ecc71 !important; }
        .pedido-card { background: white; margin: 10px; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="header">
        <h1>Nelly Delivery - Cocina</h1>
        <div id="badge-estado" class="status-badge">Desconectado</div>
    </div>

    <div id="ganancias-container" style="padding: 1rem;">
        <p id="total-dinero">Ganancias de hoy: $0</p>
    </div>

    <div id="contenedor-pedidos">
        <p style="text-align:center;">Esperando pedidos... 🕒</p>
    </div>

    <script>
        // CONFIGURACIÓN: Pega aquí tus credenciales de la consola de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAhHZvA2T-1xkIrCBpljgWPzDmynucT9_E",
            authDomain: "nelly-delivery.firebaseapp.com",
            databaseURL: "https://nelly-delivery-default-rtdb.firebaseio.com",
            projectId: "nelly-delivery",
            storageBucket: "nelly-delivery.firebasestorage.app",
            messagingSenderId: "5451083162",
            appId: "1:5451083162:web:06b03a76f50b74b60bde23"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Obtener ID del restaurante de la URL (?id=restaurante_01)
        const params = new URLSearchParams(window.location.search);
        const resID = params.get('id');

        if (!resID) {
            alert("Error: No se encontró el ID del restaurante en la URL.");
        }

        // 2. Prueba de conexión rápida
        db.ref('.info/connected').on('value', (snap) => {
          if (snap.val() === true) {
            console.log("✅ ¡Conectado a Nelly Delivery!");
            const badge = document.getElementById('badge-estado');
            badge.textContent = resID ? `Conectado: ${resID}` : 'Conectado';
            badge.classList.add('conectado');
          } else {
            console.log("❌ Sin conexión...");
            const badge = document.getElementById('badge-estado');
            badge.textContent = 'Desconectado';
            badge.classList.remove('conectado');
          }
        });

        // 3. Tu lógica de pedidos (Igual que antes pero usando 'db')
        const pedidosRef = db.ref(`pedidos/${resID}`);
        pedidosRef.on('value', (snapshot) => {
          const pedidos = snapshot.val();
          console.log("Datos recibidos:", pedidos);
          actualizarInterfaz(pedidos);
        });

        const gananciasRef = db.ref(`ganancias_dia/${resID}`);
        gananciasRef.on('value', (snapshot) => {
          const total = snapshot.val() || 0;
          document.getElementById('total-dinero').innerText = `Ganancias de hoy: $${total}`;
        });

        function actualizarInterfaz(pedidos) {
            const container = document.getElementById('contenedor-pedidos');
            container.innerHTML = ""; // Limpiar
            if (!pedidos) {
                container.innerHTML = "<p style='text-align:center;'>No hay pedidos pendientes.</p>";
                return;
            }
            // Lógica para listar pedidos...
            Object.keys(pedidos).forEach(id => {
                const p = pedidos[id];
                const cliente = p.cliente || "Cliente";
                const total = p.total ?? p.monto ?? 0;
                container.innerHTML += `
                    <div class="pedido-card">
                        <h3>Pedido de: ${cliente}</h3>
                        <p>Total: $${total}</p>
                        <p><span>Estado: ${p.estado || 'Pendiente'}</span></p>
                        <button onclick="finalizarPedido('${id}', ${total})">
                            Marcar como Entregado
                        </button>
                    </div>`;
            });
        }

        async function finalizarPedido(idPedido, monto) {
            const refOriginal = db.ref('pedidos/' + resID + '/' + idPedido);
            const refHistorial = db.ref('historial_pedidos/' + resID + '/' + idPedido);
            const refGanancias = db.ref('ganancias_dia/' + resID);

            try {
                // 1. Obtener los datos del pedido antes de borrarlo
                const snapshot = await refOriginal.once('value');
                const datos = snapshot.val();

                if (datos) {
                    // A. Mover al Historial con fecha de cierre
                    datos.fecha_entrega = new Date().toLocaleString();
                    await refHistorial.set(datos);

                    // B. Sumar Ganancia de forma atómica (evita errores si hay varios pedidos)
                    await refGanancias.transaction((valorActual) => {
                        return (valorActual || 0) + monto;
                    });

                    // C. Avisar al backend que este pedido ya está listo
                    const notified = await notifyPedidoListo(idPedido);
                    if (!notified) {
                        alert('No se pudo notificar el backend. El pedido no se finalizó completamente.');
                        return;
                    }

                    // D. Eliminar de la lista de pendientes
                    await refOriginal.remove();

                    alert('¡Pedido entregado con éxito!');
                } else {
                    alert('No se encontró el pedido para finalizar.');
                }
            } catch (error) {
                console.error('Error en el proceso:', error);
            }
        }

        async function notifyPedidoListo(idPedido) {
            try {
                const response = await fetch('/api/pedidos/listo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pedidoId: idPedido,
                        restauranteId: resID,
                        mensaje: 'Pedido listo para entrega'
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    console.warn('No se pudo notificar el pedido listo:', error);
                    return false;
                }

                return true;
            } catch (err) {
                console.error('Error al notificar pedido listo:', err);
                return false;
            }
        }
    </script>
</body>
</html>
