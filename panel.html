<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAhHZvA2T-1xkIrCBpljgWPzDmynucT9_E",
        authDomain: "nelly-delivery.firebaseapp.com",
        databaseURL: "https://nelly-delivery-default-rtdb.firebaseio.com",
        projectId: "nelly-delivery",
        storageBucket: "nelly-delivery.firebasestorage.app",
        messagingSenderId: "5451083162",
        appId: "1:5451083162:web:06b03a76f50b74b60bde23"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    // VARIABLES DE CONTROL
    const audioAlerta = new Audio('alerta.mp3'); 
    let pedidosAnteriores = 0;

    // 1. GESTIÓN DE AUTENTICACIÓN (Obligatorio para tus reglas)
    auth.onAuthStateChanged((user) => {
        const statusEl = document.getElementById('status');
        if (user) {
            statusEl.innerText = "SISTEMA ONLINE";
            statusEl.classList.add('online');
            iniciarMonitoreo();
        } else {
            statusEl.innerText = "AUTENTICANDO...";
            // Login automático con tu cuenta de admin
            auth.signInWithEmailAndPassword("admin@nelly.com", "Nelly2026!*")
                .catch(err => {
                    statusEl.innerText = "ERROR DE ACCESO";
                    console.error("Error Auth:", err);
                });
        }
    });

    function iniciarMonitoreo() {
        // MONITOR DE GANANCIAS
        db.ref('ganancias_hoy').on('value', (snap) => {
            const total = snap.val() || 0;
            document.getElementById('ganancias-valor').innerText = `$${parseFloat(total).toFixed(2)}`;
        });

        // MONITOR DE PEDIDOS (Escuchando nodo "Pedidos" con Mayúscula según estructura)
        db.ref('Pedidos').on('value', (snapshot) => {
            const container = document.getElementById('lista-pedidos');
            const contador = document.getElementById('contador-pedidos');
            container.innerHTML = "";
            
            const numPedidos = snapshot.numChildren();
            
            // Lógica de Sonido: Si hay más pedidos que antes, sonar alerta
            if (numPedidos > pedidosAnteriores && pedidosAnteriores !== 0) {
                audioAlerta.play().catch(e => console.log("Permiso de audio requerido"));
            }
            pedidosAnteriores = numPedidos;
            contador.innerText = numPedidos;

            if (!snapshot.exists()) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #94a3b8;">No hay pedidos hoy. 🍳</div>';
                return;
            }

            snapshot.forEach((child) => {
                const p = child.val();
                const monto = p.total || p.monto || 0;
                container.innerHTML += `
                    <div class="card">
                        <h3>Folio: #${child.key.substring(0, 4)}</h3>
                        <div class="info-row"><strong>👤 Cliente:</strong> ${p.cliente_nombre || p.cliente || 'Usuario Nelly'}</div>
                        <div class="info-row"><strong>📝 Nota:</strong> ${p.descripcion || 'Sin detalles'}</div>
                        <div class="price-tag">$${parseFloat(monto).toFixed(2)}</div>
                        <button class="btn-entregar" onclick="finalizarPedido('${child.key}', ${monto})">
                            LISTO PARA REPARTO
                        </button>
                    </div>`;
            });
        });
    }

    async function finalizarPedido(id, monto) {
        if (!confirm(`¿Confirmas despacho del pedido #${id.substring(0,4)}?`)) return;

        try {
            const snap = await db.ref('Pedidos/' + id).once('value');
            const datos = snap.val();

            if (datos) {
                // Mover a reparto e historial
                await db.ref('pedidos_para_reparto/' + id).set({
                    ...datos,
                    estado: 'esperando_repartidor',
                    hora_cocina: new Date().toLocaleTimeString()
                });

                await db.ref('historial_ventas/' + id).set({
                    ...datos,
                    fecha_finalizado: new Date().toLocaleString(),
                    estado: 'completado'
                });

                // Actualizar ganancias y borrar de cocina
                await db.ref('ganancias_hoy').transaction(c => (c || 0) + parseFloat(monto));
                await db.ref('Pedidos/' + id).remove();
            }
        } catch (err) {
            alert("Error al procesar: " + err.message);
        }
    }
</script>
